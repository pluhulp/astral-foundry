name: Frontline Atlas regression tests
on:
  push:
    paths:
      - 'frontline-atlas/**'
      - '.github/workflows/frontline-atlas.yml'
  pull_request:
    paths:
      - 'frontline-atlas/**'
      - '.github/workflows/frontline-atlas.yml'
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run Frontline Atlas smoke tests
        run: node frontline-atlas/smoke.test.cjs
